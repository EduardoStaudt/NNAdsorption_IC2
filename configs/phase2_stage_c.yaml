# Phase 2, stage (c): all 31 theta columns vary (whole IC1 domain). Training cases (data for the
# hybrid, fixed collocation theta for both runs): the 50 training cases of Phase 1.
inherit: phase2_base.yaml

domain:
  mode: full

data:
  path: data/provisorio_MOL_n2_60cases.h5

phase2:
  train_data: dataset
  n_time_per_case: 200    # as in Phase 1

# Over the whole domain about 1 % of the Sobol theta have a gas that hardly adsorbs at Tin (q_ref at
# its floor, 1e-6 mol/kg) or an isotherm that changes by orders of magnitude within +-40 K; there
# q~* = q*/q_ref reaches 1e3-1e6 and the squared residual of a few points (1e7-8e9) outweighed all
# the others: the plain mean-square runs blew up at lr 1e-3 and 3e-4 (docs/phase2_results.md).
# So the Cauchy loss (loss.robust_c, from phase2_base.yaml since the Optuna study) is needed here.

theta_colloc:
  # new theta every ~2600 steps, as with 2048 theta every 10 passes: 10 x (50 + 2048) / (50 + 1024)
  # passes over the pool of the 50 fixed training theta and the 1024 Sobol theta
  resample_every_epochs: 19.534450651769
  # Since Phase 6 (docs/phase6_results.md): half of the Sobol theta are picked with probability
  # proportional to the feed estimate of the temperature rise (hot collocation). Runs before Phase 6
  # used 0.0: configs/phase2_stage_c_before_hot.yaml.
  hot_frac: 0.5

logging:
  run_name: phase2c
