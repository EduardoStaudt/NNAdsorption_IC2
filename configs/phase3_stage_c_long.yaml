# Phase 3, item 1: the best stage (c) setup of Phase 2 (physics only, Cauchy loss on the PDE
# residual, lr 1e-3 with cosine decay, 6 x 128 net, 2048 Sobol theta renewed every 10 epochs)
# trained for 200 000 steps instead of 50 000 (the learning-rate decay spans the 200 000 steps),
# with the validation curve every 25 000 steps and a checkpoint every 10 000 (all kept).
inherit: phase2_stage_c.yaml

train:
  steps: 200000

loss:
  weights:
    data: 0.0

phase2:
  eval_every: 25000

logging:
  run_name: phase3c_long
  ckpt_every: 10000
  keep_checkpoints: 25
