# Phase 5, item 1: the default (trial 26 of the first Optuna study) on stage (c), physics only,
# 200 000 steps instead of 50 000 (the cosine decay spans the 200 000 steps). Validation curve every
# 25 000 steps. The plateau criterion (phase2.plateau_stop) stays off: the full 200 000 steps run
# and summary.json records where it would have stopped. Seeds 0 and 1 (--set runtime.seed=...).
inherit: phase2_stage_c.yaml

train:
  steps: 200000

loss:
  weights:
    data: 0.0

phase2:
  eval_every: 25000

logging:
  run_name: phase5c_long
  ckpt_every: 25000
  keep_checkpoints: 9
