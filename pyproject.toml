[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nnads_ic2"
version = "0.1.0"
description = "Hybrid PINN for fixed-bed adsorption with variable velocity (NNAdsorption, IC2)"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",
    "tf-keras",
    "tensorflow-probability",
    "numpy",
    "scipy",
    "pyyaml",
    "h5py",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: runs the MOL reference solver (a few seconds each)"]
